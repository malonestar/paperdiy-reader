name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++ python3
      - run: test/host/run.sh

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned components
        run: python3 fetch_repos.py
      - name: Build fonts and firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          python -m pip install --quiet freetype-py fonttools
          python tools/make_fonts.py
          idf.py build
          python tools/make_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: paperdiy-reader
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paperdiy-reader
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          overwrite_files: false   # keep binaries already attached by hand (tested builds)
